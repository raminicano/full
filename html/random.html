<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Random 숫자 추출</title>
</head>

<body>
    <h3>Random 숫자 추출</h3>
    <hr />
    <script>
        while (1) {
            let n = prompt("1~3 사이의 숫자를 입력하세요 (1가위, 2: 바위, 3: 보)", 3);
            n = parseInt(n);
            let x = Math.floor(Math.random() * 3 + 1);
            document.write("User : " + n + "&nbsp; vs ");
            document.write("Com : " + x + "<br>");
            // 가위일 때
            if (n == 1) {
                if (x == 1) document.write("비겼습니다.");
                else if (x == 2) document.write("졌습니다.");
                else document.write("이겼습니다.");
                break;
            }
            // 바위일 때
            else if (n == 2) {
                if (x == 1) document.write("이겼습니다.");
                else if (x == 2) document.write("비겼습니다.");
                else document.write("졌습니다.");
                break;
            }
            else if (n == 3) {
                if (x == 1) document.write("졌습니다.");
                else if (x == 2) document.write("이겼습니다.");
                else document.write("비겼습니다.");
                break;
            } else {
                alert("다시 입력하세요 (1~3 사이의 값)");
                continue;
            }
        }
    </script>
</body>

</html>
