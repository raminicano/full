<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>quiz5</title>
</head>

<body>
    <script>
        var array = new Array();
        let sum = 0;
        let i = 0;
        while (sum <= 20) {
            array[i] = Math.floor(Math.random() * 5 + 1);
            sum += array[i]
            i += 1;
        }
        let n = array.length;
        document.write("배열의 크기 : " + n + "<br>");
        document.write("입력된 배열 : " + array);
        document.write("<br>");
        document.write("누적 합산 값 : " + sum);
        document.write("<br>");
        document.write("최종 인덱스 : array[" + (n - 1) + "]");
    </script>

</body>

</html>
